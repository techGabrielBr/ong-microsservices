# LocalStack emula DynamoDB/SNS/SQS dentro do cluster; em producao este Deployment
# sai e as apps passam a apontar para os endpoints reais da AWS (Aws__ServiceUrl vazio).
apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init
  namespace: conexao-solidaria
data:
  01-provision-aws.sh: |
    #!/bin/bash
    set -euo pipefail
    REGION="${AWS_DEFAULT_REGION:-us-east-1}"
    awslocal dynamodb create-table \
      --table-name doacoes \
      --attribute-definitions AttributeName=CampanhaId,AttributeType=S AttributeName=DoacaoId,AttributeType=S AttributeName=DoadorId,AttributeType=S AttributeName=CriadaEm,AttributeType=S \
      --key-schema AttributeName=CampanhaId,KeyType=HASH AttributeName=DoacaoId,KeyType=RANGE \
      --global-secondary-indexes 'IndexName=doador-index,KeySchema=[{AttributeName=DoadorId,KeyType=HASH},{AttributeName=CriadaEm,KeyType=RANGE}],Projection={ProjectionType=ALL}' \
      --billing-mode PAY_PER_REQUEST --region "$REGION" >/dev/null 2>&1 || true
    awslocal sns create-topic --name doacoes-recebidas --region "$REGION" >/dev/null 2>&1 || true
    awslocal sqs create-queue --queue-name doacoes-recebidas-dlq --region "$REGION" >/dev/null 2>&1 || true
    awslocal sqs create-queue --queue-name doacoes-recebidas --region "$REGION" >/dev/null 2>&1 || true
    echo "[localstack-init] recursos provisionados"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: conexao-solidaria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.8
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: "dynamodb,sqs,sns"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: LOCALSTACK_HOST
              value: "localstack"
          volumeMounts:
            - name: init
              mountPath: /etc/localstack/init/ready.d
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
      volumes:
        - name: init
          configMap:
            name: localstack-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: conexao-solidaria
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
