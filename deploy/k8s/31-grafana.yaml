apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: conexao-solidaria
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: PROM
        access: proxy
        url: http://prometheus:9090
        isDefault: true

      - name: Zabbix
        type: alexanderzobnin-zabbix-datasource
        uid: ZABBIX
        access: proxy
        url: http://zabbix-web:8080/api_jsonrpc.php
        jsonData:
          username: Admin
          trends: true
          trendsFrom: 7d
          trendsRange: 4d
          cacheTTL: 1h
        secureJsonData:
          password: zabbix
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-plugin-provider
  namespace: conexao-solidaria
data:
  zabbix-app.yml: |
    apiVersion: 1
    apps:
      - type: alexanderzobnin-zabbix-app
        org_id: 1
        disabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: conexao-solidaria
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: conexao-solidaria
        orgId: 1
        folder: Conexao Solidaria
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
