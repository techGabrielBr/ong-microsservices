    {
      "uid": "conexao-solidaria",
      "title": "Conexao Solidaria - Plataforma",
      "tags": [
        "ong",
        "microsservicos",
        "hackathon"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
