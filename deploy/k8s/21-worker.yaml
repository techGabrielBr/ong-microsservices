apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: conexao-solidaria
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: worker
          image: conexao-solidaria/worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: conexao-solidaria-config
          env:
            - name: Aws__AccessKey
              valueFrom:
                secretKeyRef:
                  name: conexao-solidaria-secrets
                  key: Aws__AccessKey
            - name: Aws__SecretKey
              valueFrom:
                secretKeyRef:
                  name: conexao-solidaria-secrets
                  key: Aws__SecretKey
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: conexao-solidaria
  labels:
    app: worker
spec:
  selector:
    app: worker
  ports:
    - port: 8080
      targetPort: 8080
