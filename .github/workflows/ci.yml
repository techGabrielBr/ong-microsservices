name: CI - Conexao Solidaria

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-e-testes:
    name: Build e testes (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ConexaoSolidaria.slnx

      - name: Build
        run: dotnet build ConexaoSolidaria.slnx --configuration Release --no-restore

      - name: Testes de unidade (xUnit)
        run: dotnet test ConexaoSolidaria.slnx --configuration Release --no-build --logger "trx;LogFileName=testes.trx" --results-directory ./TestResults

      - name: Publicar resultados de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: ./TestResults

  imagens-docker:
    name: Build e push das imagens Docker
    runs-on: ubuntu-latest
    needs: build-e-testes
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servico: [api, worker, gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.servico }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # push apenas na branch principal; PR gera a imagem so para validar o Dockerfile
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.servico }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validar-k8s:
    name: Validar manifests do Kubernetes
    runs-on: ubuntu-latest
    needs: build-e-testes
    steps:
      - uses: actions/checkout@v4

      - name: Instalar kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validar manifests
        run: kubeconform -strict -ignore-missing-schemas -summary deploy/k8s/
